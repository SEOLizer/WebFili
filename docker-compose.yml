services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webfili
      POSTGRES_PASSWORD: webfili
      POSTGRES_DB: webfili
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webfili"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://webfili:webfili@postgres:5432/webfili
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production-min-32-chars
      JWT_REFRESH_SECRET: change-me-too-min-32-chars-refresh
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://localhost
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm start"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
